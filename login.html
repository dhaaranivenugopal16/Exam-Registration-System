<!DOCTYPE html>
<html>
<head>
<title>Login</title>
</head>
<body>
<h2>Login</h2>
<form id="f">
<input type="email" id="e" placeholder="Email" required><br><br> <input type="password" id="p" placeholder="Password" required><br><br> <button>Login</button>
</form>
<p>New user? <a href="register.html">Register</a></p>
<script>
f.onsubmit = async (x)=>{
x.preventDefault(); let res = await Auth.login(e.value, p.value); alert(res.success ? "Login Success" : "Invalid Login");}
</script>
</body> </html>
